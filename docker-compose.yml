services:
  db:
    image: postgres:16-alpine
    container_name: postgres-kruakoonpim
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=kruakoonpim
      - POSTGRES_USER=kruakoonpim
      - POSTGRES_PASSWORD=Smilez12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-tier

  web:
    build:
      context: .
      args:
        - LOGIN_PASSCODE=${LOGIN_PASSCODE}
        - INTERNAL_API_KEY=${INTERNAL_API_KEY}
        - DATABASE_URL_BUILD=${DATABASE_URL_BUILD}
        - GEMINI_API_KEY=${GEMINI_STUDIO_API_KEY}
        - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
        - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
        - GOOGLE_CLOUD_STORAGE_BUCKET=${GOOGLE_CLOUD_STORAGE_BUCKET}
    container_name: kruakoonpim-manager
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL_BUILD}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gcloud/application_default_credentials.json
    volumes:
      - "C:/Users/Boomm/AppData/Roaming/gcloud:/app/config/gcloud:ro"
    networks:
      - app-tier
      - db-tier

volumes:
  postgres_data:

networks:
  app-tier:
    driver: bridge
  db-tier:
    driver: bridge